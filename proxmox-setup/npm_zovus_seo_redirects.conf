# Paste into NPM → zovus.ru → Edit → Advanced → Custom Nginx Configuration
# Ensures single canonical host (https://zovus.ru) for crawlers and users.

# Apex: force HTTPS
if ($scheme != "https") {
  return 301 https://zovus.ru$request_uri;
}

# www → non-www (canonical in app is https://zovus.ru)
if ($host = "www.zovus.ru") {
  return 301 https://zovus.ru$request_uri;
}
