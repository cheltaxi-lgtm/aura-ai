# Production (zovus.ru) is deployed manually via hosting/deploy-beget.ps1 on Beget VPS.
# This workflow is optional Vercel preview only — it does NOT update zovus.ru.
name: Vercel preview (not production)

on:
  workflow_dispatch:

concurrency:
  group: vercel-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guardrails
        run: npm run verify:guardrails

      - name: Spread and chat quality tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: DB migrations
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            node scripts/migrate.mjs
          else
            echo "Skipping migrations: DATABASE_URL secret not set"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Vercel preview
        run: npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
