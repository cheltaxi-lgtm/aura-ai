name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guardrails
        run: npm run verify:guardrails

      - name: Spread and chat quality tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
