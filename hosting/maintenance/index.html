<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="20" />
    <title>Zovus — обновление салона</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg-0: #0c0b09;
        --bg-1: #161310;
        --ink: #ede6da;
        --muted: rgba(237, 230, 218, 0.62);
        --brass: #c4a46a;
        --brass-soft: rgba(196, 164, 106, 0.22);
        --line: rgba(237, 230, 218, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: Manrope, system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(900px 520px at 50% -10%, rgba(196, 164, 106, 0.16), transparent 60%),
          radial-gradient(700px 420px at 85% 90%, rgba(88, 64, 36, 0.28), transparent 55%),
          linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 55%, #080706 100%);
      }
      .shell {
        width: min(34rem, 100%);
        text-align: center;
      }
      .brand {
        margin: 0 0 2rem;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(2.4rem, 6vw, 3.4rem);
        font-weight: 600;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        line-height: 1;
      }
      .brand span {
        color: var(--brass);
      }
      .card {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 1.5rem;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015));
        padding: 2.25rem 1.5rem 1.75rem;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--brass-soft), transparent);
      }
      .eyebrow {
        margin: 0 0 0.85rem;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--brass);
      }
      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.85rem, 4.5vw, 2.35rem);
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1.15;
      }
      p {
        margin: 0.9rem auto 0;
        max-width: 28ch;
        font-size: 0.95rem;
        line-height: 1.6;
        color: var(--muted);
      }
      .pulse {
        width: 3.25rem;
        height: 3.25rem;
        margin: 0 auto 1.35rem;
        border-radius: 999px;
        border: 1px solid var(--brass-soft);
        background: radial-gradient(circle at 50% 40%, rgba(196, 164, 106, 0.22), transparent 65%);
        position: relative;
      }
      .pulse::after {
        content: "";
        position: absolute;
        inset: 0.55rem;
        border-radius: inherit;
        border: 1px solid rgba(196, 164, 106, 0.45);
        animation: breath 2.4s ease-in-out infinite;
      }
      @keyframes breath {
        0%,
        100% {
          transform: scale(0.86);
          opacity: 0.35;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .meta {
        margin-top: 1.35rem;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        color: rgba(237, 230, 218, 0.42);
      }
      button {
        margin-top: 1.4rem;
        appearance: none;
        border: 1px solid rgba(196, 164, 106, 0.45);
        border-radius: 999px;
        background: linear-gradient(180deg, #d4b57a, #a88745);
        color: #1a140c;
        font: inherit;
        font-size: 0.84rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        padding: 0.8rem 1.35rem;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.05);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <p class="brand">Z<span>OVUS</span></p>
      <section class="card" aria-live="polite">
        <div class="pulse" aria-hidden="true"></div>
        <p class="eyebrow">Техническая пауза</p>
        <h1>Салон обновляется</h1>
        <p>
          Мы улучшаем Zovus. Обычно это занимает несколько минут — страница откроется сама, как только
          всё будет готово.
        </p>
        <button type="button" id="retry">Проверить снова</button>
        <p class="meta">Автообновление каждые 20 секунд</p>
      </section>
    </main>
    <script>
      (function () {
        var HEALTH = "/api/health";
        async function ready() {
          try {
            var res = await fetch(HEALTH, { cache: "no-store" });
            return res.ok;
          } catch (e) {
            return false;
          }
        }
        async function retry() {
          if (await ready()) {
            window.location.replace("/");
          }
        }
        document.getElementById("retry").addEventListener("click", retry);
        setInterval(retry, 20000);
      })();
    </script>
  </body>
</html>
