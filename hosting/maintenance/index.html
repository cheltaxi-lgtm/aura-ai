<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <noscript><meta http-equiv="refresh" content="20" /></noscript>
    <title>Zovus — скоро продолжим</title>
    <style>
      :root { color-scheme: dark; --ink: #f5eddf; --muted: #c0b6a5; --gold: #dfbf80; }
      * { box-sizing: border-box; }
      html { min-height: 100%; background: #0d0c0b; }
      body {
        margin: 0; min-height: 100vh; min-height: 100svh;
        display: grid; place-items: center;
        padding: max(2rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(ellipse at 50% 0%, #30261b80, transparent 65%), radial-gradient(ellipse at 95% 100%, #28212a50, transparent 55%), #0d0c0b;
      }
      .shell { width: min(100%, 42rem); text-align: center; }
      .brand { margin: 0 0 1.75rem; color: var(--gold); font: 400 1.875rem/1 Georgia, "Times New Roman", serif; letter-spacing: .28em; text-indent: .28em; }
      .card {
        position: relative; isolation: isolate; overflow: hidden;
        padding: clamp(1.75rem, 5vw, 3.5rem) clamp(1.25rem, 5vw, 3.5rem) 2rem;
        border: 1px solid #c9a66838; border-radius: 1.75rem;
        background: radial-gradient(ellipse at 50% 0%, #d6b57312, transparent 65%), linear-gradient(155deg, #201c17, #121110 65%);
        box-shadow: 0 24px 80px #0005, inset 0 1px 0 #ffe2a80c;
      }
      .card::before { content: ""; position: absolute; inset: 0 15% auto; height: 1px; background: linear-gradient(90deg, transparent, #e6c68c85, transparent); }
      .emblem { display: grid; place-items: center; position: relative; width: 5.5rem; height: 5.5rem; margin: 0 auto 1.75rem; }
      .emblem::before, .emblem::after { content: ""; position: absolute; border: 1px solid #d8b7783b; border-radius: 50%; }
      .emblem::before { inset: 0; }
      .emblem::after { inset: .55rem; border-color: #d8b77820; }
      .emblem svg { width: 2.75rem; height: 2.75rem; color: var(--gold); filter: drop-shadow(0 0 14px #eac57550); }
      .eyebrow { margin: 0 0 1rem; color: var(--gold); font-size: .6875rem; font-weight: 600; line-height: 1.6; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.875rem, 5.3vw, 2.875rem); font-weight: 400; line-height: 1.18; letter-spacing: -.035em; }
      h1 span { display: block; }
      .description { max-width: 38ch; margin: 1.25rem auto 0; color: var(--muted); font-size: 1rem; line-height: 1.75; text-wrap: pretty; }
      .status { display: flex; align-items: center; justify-content: center; gap: .625rem; margin: 1.75rem 0; color: #e4d4b7; font-size: .8125rem; line-height: 1.5; }
      .status-dot { width: .375rem; height: .375rem; flex-shrink: 0; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 5px #dfbf800c; animation: breathe 3s ease-in-out infinite; }
      button {
        display: inline-flex; align-items: center; justify-content: center; gap: .65rem;
        width: min(100%, 17rem); min-height: 3.25rem; padding: .875rem 1.25rem;
        border: 1px solid #f3d8a0; border-radius: .875rem;
        background: linear-gradient(165deg, #f4dfaf, #d7b576 58%, #b78d49);
        box-shadow: inset 0 1px 0 #fff6, 0 6px 22px #b58b4020;
        color: #282016; font: 600 .9375rem/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer; transition: opacity .2s ease;
      }
      button svg { width: 1.125rem; height: 1.125rem; flex-shrink: 0; }
      button:hover { box-shadow: inset 0 1px 0 #fff6, 0 6px 28px #b58b4040; }
      button:focus-visible { outline: 2px solid #fff0d2; outline-offset: 5px; }
      button:disabled { cursor: wait; opacity: .75; }
      .feedback { max-width: 40ch; min-height: 3em; margin: 1rem auto 0; color: var(--muted); font-size: .8125rem; line-height: 1.5; }
      .footer { display: flex; align-items: center; justify-content: center; gap: .75rem; margin: 1.5rem 0 0; color: #b5a58c; font-size: .75rem; line-height: 1.5; }
      .footer::before, .footer::after { content: ""; width: 2rem; height: 1px; background: #bba07840; }
      @keyframes breathe { 50% { opacity: .4; } }
      @media (max-width: 380px) { .card { border-radius: 1.25rem; } h1 { font-size: 1.75rem; } .description { font-size: .9375rem; } }
      @media (max-height: 740px) and (min-width: 600px) {
        body { padding-block: 1.25rem; }
        .brand { margin-bottom: 1.25rem; }
        .card { padding-block: 1.5rem; }
        .emblem { width: 3.75rem; height: 3.75rem; margin-bottom: 1rem; }
        .emblem svg { width: 2rem; height: 2rem; }
        .eyebrow { margin-bottom: .75rem; }
        h1 { font-size: 2.25rem; }
        .description { margin-top: 1rem; line-height: 1.6; }
        .status { margin-block: 1.25rem; }
        .footer { margin-top: 1rem; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <p class="brand" aria-label="Zovus">ZOVUS</p>
      <section class="card" aria-labelledby="pause-title">
        <div class="emblem" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none"><path d="M24 4c2.5 13 7 17.5 20 20-13 2.5-17.5 7-20 20C21.5 31 17 26.5 4 24 17 21.5 21.5 17 24 4Z" stroke="currentColor" stroke-width="1"/><path d="m24 15 9 9-9 9-9-9 9-9Z" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width=".7"/></svg>
        </div>
        <p class="eyebrow">Техническая пауза</p>
        <h1 id="pause-title"><span>Небольшая пауза.</span><span>Скоро продолжим.</span></h1>
        <p class="description">Обновляем Zovus для ваших новых открытий. Сайт откроется автоматически, как только всё будет готово.</p>
        <p class="status"><span class="status-dot" aria-hidden="true"></span>Идёт обновление</p>
        <button type="button" id="retry">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 17.9 17"/></svg>
          <span id="retry-label">Проверить доступность</span>
        </button>
        <p class="feedback" id="feedback" role="status">Проверяем автоматически каждые 20 секунд.<br />Можно оставить эту вкладку открытой.</p>
      </section>
      <p class="footer">Спасибо, что вы с нами</p>
    </main>
    <script>
      (function () {
        var button = document.getElementById("retry");
        var label = document.getElementById("retry-label");
        var feedback = document.getElementById("feedback");
        var checking = false;
        async function retry(manual) {
          if (checking) return;
          checking = true;
          button.disabled = true;
          label.textContent = "Проверяем…";
          var controller = new AbortController();
          var timeout = setTimeout(function () { controller.abort(); }, 8000);
          try {
            var response = await fetch("/api/health", { cache: "no-store", signal: controller.signal });
            if (response.ok) {
              feedback.textContent = "Всё готово. Возвращаемся в Zovus…";
              window.location.reload();
              return;
            }
            if (manual) feedback.textContent = "Обновление ещё идёт. Проверим снова автоматически.";
          } catch (error) {
            if (manual) feedback.textContent = "Пока не удалось подключиться. Попробуем снова автоматически.";
          } finally {
            clearTimeout(timeout);
            checking = false;
            button.disabled = false;
            label.textContent = "Проверить доступность";
          }
        }
        button.addEventListener("click", function () { retry(true); });
        setInterval(function () { retry(false); }, 20000);
      })();
    </script>
  </body>
</html>
